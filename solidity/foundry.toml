[profile.default]
solc_version = "0.8.28"
evm_version = "cancun"
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]
optimizer = true
optimizer_runs = 1
via_ir = true
cache_path = "cache_forge"
remappings = ["forge-std/=lib/forge-std/src/"]
# Tests and the deploy script read the cross-implementation vectors, the proof fixtures and the
# released vkeys.
fs_permissions = [{ access = "read", path = "../circuits" }, { access = "read", path = "../tests/vectors" }]
# The 16-member lifecycle tests compute hundreds of BabyJubJub scalar products.
gas_limit = "18446744073709551615"
# Per-action gas snapshots are only meaningful with every call in its own transaction:
# FOUNDRY_PROFILE=gas forge snapshot --match-contract Gas
gas_snapshot_emit = false

# Gas is measured under Osaka, what Sepolia and Gnosis run (EIP-7883 reprices the modexp the
# curve library inverts with). solc 0.8.28 knows no "osaka": forge compiles for the newest EVM
# it supports (prague, same code as cancun) and executes the tests under Osaka.
[profile.gas]
isolate = true
gas_snapshot_emit = true
evm_version = "osaka"

[fuzz]
runs = 1000

[lint]
lint_on_build = false

[fmt]
# Generated by the circuits release (snarkjs): regenerate, never reformat.
ignore = ["src/verifiers/*.sol"]
