# Static serving for the app image: every unknown path falls back to index.html, so the
# client-side routes (/new, /c/<ceremony id>) load on a hard refresh. /config.json is never cached:
# it carries the deployment the app talks to.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /config.json {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
