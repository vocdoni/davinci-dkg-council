# Static serving for the app image: every unknown path falls back to index.html, so the
# client-side routes (/new, /c/<ceremony id>) load on a hard refresh. /config.json is never cached:
# it carries the deployment the app talks to.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /config.json {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Circuit files baked into an image (scripts/railway-deploy-ui.sh). A missing one is a 404,
    # not the app's index.html; the SDK checks every byte against its sha256 pins either way.
    location ~ ^/circuits-v[0-9]+/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        try_files $uri /index.html;
    }
}
