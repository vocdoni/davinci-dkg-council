name: Release

# Triggered when a semver tag (e.g. v0.1.0, v1.2.3, v1.2.3-rc1) is pushed: publishes the relayer
# and web app images for the tag and creates the GitHub release with generated notes. Circuit
# artifacts are released separately as `circuits-vN` (publish-circuits.yml).

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0). Must already exist."
        required: true
        type: string

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. The relayer image. A stable release also moves `latest`; a prerelease
  #    (v1.2.3-rc1) does not.
  # ---------------------------------------------------------------------------
  docker:
    name: Relayer Docker
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-build.yml
    with:
      image-tag: ${{ github.event.inputs.tag || github.ref_name }}
      push: true

  # ---------------------------------------------------------------------------
  # 2. The web app image for the same tag.
  # ---------------------------------------------------------------------------
  ui-docker:
    name: Web app Docker
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ui-docker-build.yml
    with:
      image-tag: ${{ github.event.inputs.tag || github.ref_name }}
      push: true

  # ---------------------------------------------------------------------------
  # 3. The GitHub release, once both images are out.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish GitHub release
    needs: [docker, ui-docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          generate_release_notes: true
