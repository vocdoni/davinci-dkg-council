name: Relayer Docker

# Reusable workflow that builds the relayer image (relayer/Dockerfile) and optionally publishes it
# to GHCR as ghcr.io/vocdoni/davinci-dkg-council-relayer. Callers pass an `image-tag` (typically
# the git ref name); a stable release tag (vX.Y.Z) additionally moves `latest`. Prereleases
# (v1.2.3-rc1) publish their own tag only.

on:
  workflow_call:
    inputs:
      image-tag:
        description: "Primary tag to push (e.g. main, v0.1.0, pr-123)."
        required: true
        type: string
      push:
        description: "Whether to push to the registry (true) or only build (false)."
        required: false
        type: boolean
        default: false

jobs:
  docker:
    name: ${{ inputs.push && 'Build and Publish' || 'Build' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compose tag list
        id: tags
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image-tag }}
        run: |
          # Refs with slashes (feature/foo) are not valid Docker tags, so flatten them.
          primary=$(echo "$IMAGE_TAG" | tr '/' '-')
          image=ghcr.io/vocdoni/davinci-dkg-council-relayer
          tags="${image}:${primary}"
          # Only a stable release tag moves `latest`.
          if [[ "${primary}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            tags="${tags}"$'\n'"${image}:latest"
          fi
          {
            echo 'list<<EOF'
            echo "${tags}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: ${{ inputs.push && 'Build and Publish' || 'Build' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: relayer/Dockerfile
          push: ${{ inputs.push }}
          cache-from: type=gha,scope=relayer
          cache-to: type=gha,mode=max,scope=relayer
          tags: ${{ steps.tags.outputs.list }}
